<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="1180" height="400" fill="#1d1d1d"/>
  <!-- wires (behind nodes) -->
  <path d="M190 132 C 240 132, 240 120, 280 120" stroke="#6363c7" stroke-width="3" fill="none"/>
  <path d="M470 88 C 510 88, 510 250, 550 250" stroke="#6363c7" stroke-width="3" fill="none"/>
  <path d="M740 74 C 790 74, 790 110, 830 110" stroke="#c7c729" stroke-width="3" fill="none"/>
  <path d="M1000 74 C 1030 74, 1030 290, 1050 290" stroke="#63c763" stroke-width="3" fill="none"/>
  <!-- Texture Coordinate -->
  <g>
    <rect x="20" y="40" width="170" height="210" rx="6" fill="#303030" stroke="#000"/>
    <rect x="20" y="40" width="170" height="28" rx="6" fill="#83314a"/>
    <text x="30" y="59" fill="#fff" font-weight="bold">Texture Coordinate</text>
    <g fill="#ccc" text-anchor="end">
      <text x="178" y="92">Generated</text><text x="178" y="112">Normal</text>
      <text x="178" y="137" fill="#fff" font-weight="bold">Object</text>
      <text x="178" y="162">UV</text><text x="178" y="187">Camera</text><text x="178" y="212">Window</text><text x="178" y="237">Reflection</text>
    </g>
    <g fill="#6363c7"><circle cx="190" cy="88" r="5"/><circle cx="190" cy="108" r="5"/><circle cx="190" cy="132" r="6" stroke="#fff"/><circle cx="190" cy="158" r="5"/><circle cx="190" cy="183" r="5"/><circle cx="190" cy="208" r="5"/><circle cx="190" cy="233" r="5"/></g>
  </g>
  <!-- Mapping -->
  <g>
    <rect x="280" y="40" width="190" height="300" rx="6" fill="#303030" stroke="#000"/>
    <rect x="280" y="40" width="190" height="28" rx="6" fill="#3c3c83"/>
    <text x="290" y="59" fill="#fff" font-weight="bold">Mapping</text>
    <text x="458" y="92" fill="#ccc" text-anchor="end">Vector</text><circle cx="470" cy="88" r="5" fill="#6363c7"/>
    <text x="300" y="124" fill="#ccc">Vector</text><circle cx="280" cy="120" r="5" fill="#6363c7"/>
    <text x="290" y="150" fill="#999">Type: Point</text>
    <text x="290" y="175" fill="#999">Location 0 · 0 · 0</text>
    <text x="290" y="200" fill="#999">Rotation 0° · 0° · 0°</text>
    <text x="290" y="228" fill="#fff" font-weight="bold">Scale</text>
    <rect x="290" y="236" width="170" height="24" rx="4" fill="#545454"/><text x="300" y="253" fill="#fff" font-weight="bold">X  0.33</text>
    <rect x="290" y="262" width="170" height="24" rx="4" fill="#545454"/><text x="300" y="279" fill="#fff" font-weight="bold">Y  0.33</text>
    <rect x="290" y="288" width="170" height="24" rx="4" fill="#545454"/><text x="300" y="305" fill="#fff" font-weight="bold">Z  0.33</text>
  </g>
  <!-- Image Texture -->
  <g>
    <rect x="550" y="40" width="190" height="240" rx="6" fill="#303030" stroke="#000"/>
    <rect x="550" y="40" width="190" height="28" rx="6" fill="#83501f"/>
    <text x="560" y="59" fill="#fff" font-weight="bold">Image Texture</text>
    <text x="728" y="78" fill="#fff" text-anchor="end" font-weight="bold">Color</text><circle cx="740" cy="74" r="6" fill="#c7c729" stroke="#fff"/>
    <text x="728" y="100" fill="#ccc" text-anchor="end">Alpha</text><circle cx="740" cy="96" r="5" fill="#a1a1a1"/>
    <rect x="560" y="112" width="170" height="24" rx="4" fill="#545454"/><text x="570" y="129" fill="#fff" font-weight="bold">your window image</text>
    <text x="560" y="160" fill="#999">Linear</text>
    <rect x="560" y="170" width="170" height="24" rx="4" fill="#545454"/><text x="570" y="187" fill="#fff" font-weight="bold">Box</text>
    <text x="560" y="215" fill="#999">Repeat</text>
    <text x="568" y="254" fill="#ccc">Vector</text><circle cx="550" cy="250" r="5" fill="#6363c7"/>
  </g>
  <!-- Principled BSDF (short) -->
  <g>
    <rect x="830" y="40" width="170" height="150" rx="6" fill="#303030" stroke="#000"/>
    <rect x="830" y="40" width="170" height="28" rx="6" fill="#1f6b3a"/>
    <text x="840" y="59" fill="#fff" font-weight="bold">Principled BSDF</text>
    <text x="988" y="78" fill="#ccc" text-anchor="end">BSDF</text><circle cx="1000" cy="74" r="5" fill="#63c763"/>
    <text x="850" y="114" fill="#fff" font-weight="bold">Base Color</text><circle cx="830" cy="110" r="6" fill="#c7c729" stroke="#fff"/>
    <text x="850" y="140" fill="#999">Metallic 0</text><circle cx="830" cy="136" r="5" fill="#a1a1a1"/>
    <text x="850" y="166" fill="#999">Roughness 0.5 …</text><circle cx="830" cy="162" r="5" fill="#a1a1a1"/>
  </g>
  <!-- Material Output -->
  <g>
    <rect x="1050" y="250" width="120" height="110" rx="6" fill="#303030" stroke="#000"/>
    <rect x="1050" y="250" width="120" height="28" rx="6" fill="#83314a"/>
    <text x="1060" y="269" fill="#fff" font-weight="bold">Material Output</text>
    <text x="1068" y="294" fill="#ccc">Surface</text><circle cx="1050" cy="290" r="5" fill="#63c763"/>
    <text x="1068" y="320" fill="#999">Volume</text><circle cx="1050" cy="316" r="5" fill="#63c763"/>
    <text x="1068" y="346" fill="#999">Displacement</text><circle cx="1050" cy="342" r="5" fill="#6363c7"/>
  </g>
  <text x="20" y="385" fill="#bbb" font-size="13">Bold white = what you set or connect. Purple wires = vectors, yellow = colour, green = shader. Object → Vector → Vector, Color → Base Color.</text>
</svg>
